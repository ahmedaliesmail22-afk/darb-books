services:
  postgres:
    image: postgres:16-alpine
    container_name: darb-books-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-darb_books}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darb} -d ${POSTGRES_DB:-darb_books}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: darb-books-r2-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-darbminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-darbminio_dev_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
