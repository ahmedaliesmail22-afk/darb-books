<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة درب للكتب والروايات والتوثيق الهندسي</title>
  <meta http-equiv="refresh" content="0; url=engine/index.html">
  <script>
    // تمرير معامِلات الاستعلام بالكامل (مثل ?edition=epic-v1) إلى المحرك
    window.location.replace('engine/index.html' + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .loader-card {
      background: rgba(18, 24, 38, 0.95);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      max-width: 400px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; margin-bottom: 8px; color: #f59e0b; }
    p { font-size: 0.9rem; color: #94a3b8; margin: 0; }
    a { color: #38bdf8; text-decoration: none; display: inline-block; margin-top: 15px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <h1>بوابة درب للكتب والروايات</h1>
    <p>جارٍ الانتقال إلى المحرك التفاعلي ثلاثي الأبعاد...</p>
    <a href="engine/index.html">إذا لم يتم تحويلك تلقائياً اضغط هنا</a>
  </div>
</body>
</html>
