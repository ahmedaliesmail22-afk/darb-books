// التكامل مع واجهة Telegram WebApp
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// -----------------------------------------------------------------------------
// محرك الصوت الاصطناعي لتقليب الورق (Web Audio API Synthesizer)
// -----------------------------------------------------------------------------
let audioCtx = null;
let soundEnabled = true;

function playPaperTurnSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const bufferSize = audioCtx.sampleRate * 0.08; // 80ms
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1; // ضجيج أبيض
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400; // تردد حفيف الورق الطبيعي
    filter.Q.value = 3.0;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start();
  } catch (e) {
    // تجاوز في حال تقييد الصوت من المتصفح
  }
}

    `
  },

  // صفحة 18: الخاتمة والمواصفات
  {

    title: "🌟 خاتمة المشروع ومواصفات السجل",
    html: `

      </div>

      <div class="stat-grid">
        <div class="stat-box"><span class="stat-num">2026</span><span class="stat-label">سنة الاعتماد والإنتاج</span></div>
        <div class="stat-box"><span class="stat-num">78</span><span class="stat-label">ملفاً مكتملاً وموثقاً</span></div>

    `
  },

  // صفحة 19: الغلاف الخارجي الخلفي
  {
    isCover: true,
    html: `
      <div class="page-cover">
        <div class="cover-emblem">✨</div>
        <div>
          <div class="cover-title" style="font-size:24px;">مَنْظُومَةُ دَرْبِ التَّعْلِيمِيَّة</div>
          <div class="cover-subtitle" style="margin-top:10px;">
            نظام متكامل يربط الطالب والأسرة والمدرسة برؤية هندسية رصينة وأداء لحظي فائق.
          </div>
          <div style="margin:25px 0;">
            <div style="font-family:monospace;font-size:18px;color:var(--gold);letter-spacing:4px;">||| | |||| | ||| |||| | |</div>

    `
  }

// -----------------------------------------------------------------------------
// إدارة حالة القارئ وتقليب الصفحات (State & Page Flipping Logic)
// -----------------------------------------------------------------------------
let currentSpreadIndex = 0; // فهرس الزوج الحالي (0 = الغلاف الأمامي)
const totalSpreads = Math.ceil(PAGES.length / 2);

const rightPageEl = document.getElementById('rightPage');
const leftPageEl = document.getElementById('leftPage');
const pageIndicatorEl = document.getElementById('pageIndicator');
const progressFillEl = document.getElementById('progressFill');
const bookEl = document.getElementById('bookElement');

function renderSpread(direction = 'none') {
  const rightIndex = currentSpreadIndex * 2;
  const leftIndex = rightIndex + 1;

  const rightData = PAGES[rightIndex];
  const leftData = PAGES[leftIndex];

  // تشغيل صوت تقليب الورق
  if (direction !== 'none') {
    playPaperTurnSound();
  }

  // تطبيق مؤثر الحركة ثلاثي الأبعاد
  bookEl.classList.remove('flip-anim-forward', 'flip-anim-backward');
  void bookEl.offsetWidth; // إعادة تهيئة الحركة
  if (direction === 'forward') bookEl.classList.add('flip-anim-forward');
  if (direction === 'backward') bookEl.classList.add('flip-anim-backward');

  // تعبئة الصفحة اليمنى
  if (rightData) {
    if (rightData.isCover) {
      rightPageEl.innerHTML = rightData.html;
    } else {
      rightPageEl.innerHTML = `
        <div class="page-header-tag">
          <span>${rightData.header || 'سِفْرُ دَرْب'}</span>
          <span>منظومة درب التعليمية</span>
        </div>
        <h2 class="page-title">${rightData.title}</h2>
        <div class="page-body">${rightData.html}</div>
        <div class="page-footer">
          <span>صفحة ${rightIndex}</span>
          <span>سِفْرُ دَرْب — الكتاب التشريحي</span>
        </div>
      `;
    }
  } else {
    rightPageEl.innerHTML = '';
  }

  // تعبئة الصفحة اليسرى
  if (leftData) {
    if (leftData.isCover) {
      leftPageEl.innerHTML = leftData.html;
    } else {
      leftPageEl.innerHTML = `
        <div class="page-header-tag">
          <span>${leftData.header || 'سِفْرُ دَرْب'}</span>
          <span>منظومة درب التعليمية</span>
        </div>
        <h2 class="page-title">${leftData.title}</h2>
        <div class="page-body">${leftData.html}</div>
        <div class="page-footer">
          <span>سِفْرُ دَرْب — الكتاب التشريحي</span>
          <span>صفحة ${leftIndex}</span>
        </div>
      `;
    }
  } else {
    leftPageEl.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;opacity:0.2;">✨</div>';
  }

  // تحديث المؤشرات
  updateIndicators();
}

function updateIndicators() {
  const rightIndex = currentSpreadIndex * 2;
  const leftIndex = rightIndex + 1;

  if (currentSpreadIndex === 0) {
    pageIndicatorEl.textContent = 'الغلاف الأمامي';
  } else if (rightIndex >= PAGES.length - 2) {
    pageIndicatorEl.textContent = 'الغلاف الخلفي';
  } else {
    pageIndicatorEl.textContent = 'صفحة ' + rightIndex + ' - ' + leftIndex + ' من ' + (PAGES.length - 1);
  }

  const pct = (currentSpreadIndex / (totalSpreads - 1)) * 100;
  progressFillEl.style.width = pct + '%';
}

function nextPage() {
  if (currentSpreadIndex < totalSpreads - 1) {
    currentSpreadIndex++;
    renderSpread('forward');
  }
}

function prevPage() {
  if (currentSpreadIndex > 0) {
    currentSpreadIndex--;
    renderSpread('backward');
  }
}

function goToPage(pageNumber) {
  const targetSpread = Math.floor(pageNumber / 2);
  if (targetSpread >= 0 && targetSpread < totalSpreads) {
    const dir = targetSpread > currentSpreadIndex ? 'forward' : 'backward';
    currentSpreadIndex = targetSpread;
    renderSpread(dir);
  }
}

// -----------------------------------------------------------------------------
// ربط أزرار التحكم وأحداث الواجهة
// -----------------------------------------------------------------------------
document.getElementById('btnNext').addEventListener('click', nextPage);
document.getElementById('btnPrev').addEventListener('click', prevPage);

// نقر شريط التقدم للانتقال السريع
document.getElementById('progressTrack').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  // في الواجهة العربية RTL نقلب النسبة
  const spread = Math.round((1 - ratio) * (totalSpreads - 1));
  currentSpreadIndex = Math.max(0, Math.min(totalSpreads - 1, spread));
  renderSpread('forward');
});

// زر الفهرس السريع
document.getElementById('btnToc').addEventListener('click', () => {
  goToPage(2);
});

// زر كتم / تشغيل الصوت
const btnSoundEl = document.getElementById('btnSound');
btnSoundEl.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  btnSoundEl.textContent = soundEnabled ? '🔊' : '🔇';
  btnSoundEl.title = soundEnabled ? 'كتم صوت الورق' : 'تشغيل صوت الورق';
});

// زر تبديل الثيمات (Sepia / Dark / Light)
const themes = ['theme-sepia', 'theme-dark', 'theme-light'];
let currentThemeIndex = 0;
const btnThemeEl = document.getElementById('btnTheme');
btnThemeEl.addEventListener('click', () => {
  document.body.classList.remove(themes[currentThemeIndex]);
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  document.body.classList.add(themes[currentThemeIndex]);
  const icons = ['📜', '🌙', '☀️'];
  btnThemeEl.textContent = icons[currentThemeIndex];
});

// زر ملء الشاشة (Fullscreen)
document.getElementById('btnFullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

// التنقل بالأسهم من لوحة المفاتيح
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') {
    nextPage();
  } else if (e.key === 'ArrowRight' || e.key === 'PageUp') {
    prevPage();
  } else if (e.key === 'Home') {
    goToPage(0);
  } else if (e.key === 'End') {
    goToPage(PAGES.length - 1);
  }
});

// دعم سحب الشاشة باللمس للهواتف الذكية (Swipe Gestures)
let touchStartX = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

window.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  if (diff > 50) {
    prevPage(); // سحب لليمين
  } else if (diff < -50) {
    nextPage(); // سحب لليسار
  }
}, { passive: true });

// التحميل والتشغيل الأولي
renderSpread('none');
</script>
